  - id: idor-order-invoice
    title: "IDOR — read another customer's order invoice"
    family: 02-access-control
    category: "IDOR / BOLA"
    skill: idor-bola
    owasp_web: [A01:2021]
    owasp_api: [API1:2023]
    cwe: [CWE-639]
    difficulty: 2
    tier: retail
    location: "GET /retail/orders/<order_id>/invoice"
    gui: "Account → Orders → order → “View invoice” (tamper the id)"
    oracle_type: canary
