# ==========================================================================
# SPRKL — Vulnerability Findings Catalog  (SINGLE SOURCE OF TRUTH)
# ==========================================================================
# Every deliberately-planted vulnerability in SPRKL is one record below.
# The application (oracle hooks), the scoring API, and the generated
# CHEAT SHEET all read from THIS file. Nothing is defined in two places.
#
# Field reference:
#   id           unique kebab-case slug (also the solve key)
#   title        human-readable finding name
#   family       Ptolemy family (NN-name)
#   category     fine-grained vulnerability category
#   skill        Ptolemy exploit skill `name` this maps to (coverage anchor)
#   owasp_web    OWASP Web Top 10 (2021) ids
#   owasp_api    OWASP API Top 10 (2023) ids
#   cwe          CWE ids
#   difficulty   1 (trivial) .. 6 (expert)
#   tier         public | retail | corporate | api
#   location     where in the app it lives (method + path + param)
#   oracle_type  sink-predicate | oast | state-diff | canary
#   status       live | na   (na = documented-but-not-implemented, with reason)
#   hint         a nudge for the cheat sheet (not exploit steps)
#   description  what the finding is
# ==========================================================================

findings:

