# OPTIONAL real-services overlay (future / advanced use).
#
# The default SPRKL image is fully self-contained (SQLite + in-process fakes) and
# needs nothing here. This stub sketches how a higher-fidelity deployment could
# swap the in-process backends for real servers so tooling like sqlmap sees an
# authentic MySQL dialect, etc. The app code would need matching backend adapters
# (not implemented in the single-image build).
#
# Usage (once adapters exist):
#   docker compose -f docker-compose.yml -f docker-compose.override.example.yml up
version: "3.9"
services:
  sprkl:
    build: .
    ports:
      - "8080:8080"   # storefront
      - "9090:9090"   # oracle / scoring
    environment:
      SPRKL_ORACLE_KEY: change-me-for-a-real-run
