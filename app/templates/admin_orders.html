{% extends "admin_base.html" %}
{% block body %}
<h1>Wholesale orders</h1>
<div class="panel">
  <p class="muted">View orders for an organization.</p>
  <form id="ordf" style="display:flex;gap:6px"><input name="org" placeholder="org id (e.g. 100)"><button class="btn sm">View</button></form>
  <pre class="result"></pre>
</div>
<script>
document.getElementById('ordf').addEventListener('submit',async e=>{
  e.preventDefault();
  const r=await fetch('/api/v2/orgs/'+e.target.org.value+'/orders');
  document.querySelector('.result').textContent=JSON.stringify(await r.json(),null,2);
});
</script>
{% endblock %}
