{% extends "base.html" %}
{% block body %}
<h1>Contact Support</h1>
{% if sent %}<div class="card ok">Thanks — a SPRKL specialist will reply by email shortly.</div>{% endif %}
<form method="post" action="/contact" class="card" style="max-width:520px">
  <label>Your email</label><input name="email" placeholder="you@example.com" style="width:100%">
  <label>Subject</label><input name="subject" placeholder="Order question" style="width:100%">
  <label>Message</label><textarea name="message"></textarea>
  <button class="btn" style="margin-top:10px">Send message</button>
</form>
{% endblock %}
