{% extends "admin_base.html" %}
{% block body %}
<h1>Employee directory</h1>
<div class="panel">
  <form method="get" action="/admin/directory" style="display:flex;gap:6px">
    <input name="u" value="{{ u or '' }}" placeholder="username"><button class="btn sm">Search</button></form>
  {% if results is not none %}
  <pre class="result">{{ results }}</pre>
  {% endif %}
</div>
{% endblock %}
