{% extends "base.html" %}
{% block body %}
<h1>Track order</h1>
<form class="ajax" method="get" action="/retail/track" style="display:flex;gap:6px;max-width:420px">
  <input name="ref" value="{{ ref }}" placeholder="SP-AAA111"><button class="btn sm">Track</button></form>
{% if order %}<div class="card" style="margin-top:12px">Ref {{ order['ref'] }} — status: {{ order['status'] }}</div>{% endif %}
{% endblock %}
