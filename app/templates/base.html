<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}SPRKL — Sparkling Water{% endblock %}</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;color:#0a2540;background:#eaf6ff}
    header{background:#0a2540;color:#fff;padding:12px 20px;display:flex;gap:20px;align-items:center}
    header a{color:#7fd3ff;text-decoration:none;font-size:14px}
    header .logo{font-weight:800;font-size:20px;color:#fff;letter-spacing:2px}
    .warn{background:#ffe8b3;color:#7a5200;padding:6px 20px;font-size:12px}
    main{max-width:900px;margin:20px auto;padding:0 20px}
    .card{background:#fff;border-radius:10px;padding:16px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
    input,button,select{padding:8px;border-radius:6px;border:1px solid #bcd;font-size:14px}
    button{background:#0a84ff;color:#fff;border:none;cursor:pointer}
    .err{color:#b00020}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
    code{background:#f0f4f8;padding:2px 4px;border-radius:4px}
  </style>
</head>
<body>
  <header>
    <span class="logo">SPRKL</span>
    <a href="/">Shop</a><a href="/products">All Flavors</a><a href="/search">Search</a>
    <a href="/retail/login">Account</a><a href="/corporate/login">Corporate</a>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
