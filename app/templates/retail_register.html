{% extends "base.html" %}
{% block body %}
<div style="max-width:420px;margin:0 auto">
<h1>Create your account</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" class="card">
  <label>Name</label><input name="name" style="width:100%">
  <label>Email</label><input name="email" placeholder="you@example.com" style="width:100%">
  <label>Password</label><input name="password" type="password" style="width:100%">
  <button class="btn" style="width:100%;margin-top:12px">Create account</button>
</form>
<p class="muted" style="text-align:center;margin-top:12px">Already have an account? <a href="/retail/login">Sign in</a></p>
</div>
{% endblock %}
