{% extends "base.html" %}
{% block body %}
<h1>Manage your subscription</h1>
<div class="card" style="max-width:480px">
  <b>Look up your subscription</b>
  <form id="nl" style="display:flex;gap:6px;margin-top:8px">
    <input name="email" placeholder="you@example.com"><button class="btn sm">Find</button>
  </form>
  <pre class="result"></pre>
</div>
<script>
document.getElementById('nl').addEventListener('submit', async e => {
  e.preventDefault();
  const email = e.target.querySelector('[name=email]').value;
  const r = await fetch('/api/v2/newsletter/find', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({email: email})});
  document.querySelector('.result').textContent = JSON.stringify(await r.json(), null, 2);
});
</script>
{% endblock %}
