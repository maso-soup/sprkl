# Build the two SPRKL images and publish them to GHCR.
#   - push to main        -> ghcr.io/maso-soup/sprkl-{app,scorer}:latest + :sha-<short>
#   - push a tag vX.Y.Z    -> ...:vX.Y.Z + :sha-<short>   (pin these in benchmarks)
#   - pull request         -> build + smoke-test only (no publish)
# Images are only pushed AFTER the stack boots, scores a real exploit through the
# ingress proxy, and the app image is proven to carry no answer key.
name: publish-images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_IMAGE: ghcr.io/maso-soup/sprkl-app
  SCORER_IMAGE: ghcr.io/maso-soup/sprkl-scorer

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3        # emulation for arm64
      - uses: docker/setup-buildx-action@v3

      # ---- 1) build both images locally and SMOKE TEST the stack ----
      - name: Build app image (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          load: true
          tags: sprkl-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build scorer image (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.scorer
          load: true
          tags: sprkl-scorer:latest
          cache-from: type=gha,scope=scorer
          cache-to: type=gha,mode=max,scope=scorer

      - name: Smoke test (stack boots, proxy scores a real exploit)
        env:
          SPRKL_ORACLE_KEY: ci-smoke-key
        run: |
          set -euo pipefail
          docker compose up -d --no-build
          KEY='X-Oracle-Key: ci-smoke-key'

          echo "== storefront reachable through the proxy on 8080 =="
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/ >/dev/null

          echo "== score API on 9090 is gated (401 without key, 200 with) =="
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9090/oracle/score)" = "401"
          curl -fsS -H "$KEY" http://localhost:9090/oracle/score \
            | grep -qE '"total_live":[[:space:]]*95'

          echo "== end-to-end: an exploit through the proxy records a solve =="
          curl -fsS "http://localhost:8080/search?q=lime%27" >/dev/null
          for i in $(seq 1 10); do
            if curl -fsS -H "$KEY" http://localhost:9090/oracle/solves | grep -q 'sqli-error-search'; then
              break; fi
            sleep 1
          done
          curl -fsS -H "$KEY" http://localhost:9090/oracle/solves | grep -q 'sqli-error-search'

          echo "== the APP image carries no answer key =="
          for f in findings.yaml scorer CHEATSHEET.md cheatsheet.html README.md tools tests; do
            if docker run --rm --entrypoint sh sprkl-app:latest -c "test -e /app/$f"; then
              echo "FAIL: /app/$f is in the app image — a file-read finding could leak it"
              exit 1
            fi
          done

          echo "== the SCORER image DOES hold the rules + catalog (and nothing published them to the app) =="
          docker run --rm --entrypoint sh sprkl-scorer:latest -c 'test -e /srv/findings.yaml && test -e /srv/scorer/rules.py'

          echo "smoke test passed"
          docker compose down -v

      # ---- 2) only past this point do we authenticate + publish ----
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels (app)
        if: github.event_name != 'pull_request'
        id: meta_app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Tags & labels (scorer)
        if: github.event_name != 'pull_request'
        id: meta_scorer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SCORER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build (multi-arch) & push app
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build (multi-arch) & push scorer
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.scorer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_scorer.outputs.tags }}
          labels: ${{ steps.meta_scorer.outputs.labels }}
          cache-from: type=gha,scope=scorer
          cache-to: type=gha,mode=max,scope=scorer
