# Build the SPRKL image and publish it to GHCR.
#   - push to main            -> ghcr.io/maso-soup/sprkl:latest + :sha-<short>
#   - push a tag  vX.Y.Z      -> ghcr.io/maso-soup/sprkl:vX.Y.Z + :sha-<short>  (pin these in benchmarks)
#   - pull request            -> build + smoke-test only (no publish)
# The image is only pushed AFTER it boots and its oracle records a real solve.
name: publish-image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/maso-soup/sprkl

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3        # emulation for arm64
      - uses: docker/setup-buildx-action@v3

      # ---- 1) build a single-arch image locally and SMOKE TEST it ----
      - name: Build (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sprkl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boot + oracle end-to-end)
        run: |
          set -euo pipefail
          docker run -d --name sprkl -p 8080:8080 -p 9090:9090 \
            -e SPRKL_ORACLE_KEY=ci-smoke-key sprkl:ci
          # wait for the app to come up
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "== storefront renders =="
          curl -fsS http://localhost:8080/ >/dev/null
          echo "== oracle is gated (expect 401 without key) =="
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9090/oracle/score)" = "401"
          echo "== catalog has the expected live findings =="
          curl -fsS -H 'X-Oracle-Key: ci-smoke-key' http://localhost:9090/oracle/score \
            | grep -qE '"total_live":[[:space:]]*95'
          echo "== end-to-end: a GUI action records a solve =="
          curl -fsS "http://localhost:8080/search?q=lime%27" >/dev/null
          curl -fsS -H 'X-Oracle-Key: ci-smoke-key' http://localhost:9090/oracle/solves \
            | grep -q 'sqli-error-search'
          echo "smoke test passed"
          docker rm -f sprkl >/dev/null

      # ---- 2) only past this point do we authenticate + publish ----
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags & labels
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build (multi-arch) & push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
